[project]
name = "swapdesk"
version = "0.1.0"
description = "SwapDesk exchange agent for a fictional shoe shop (neatHack)"
authors = [
    { name = "adr1en360", email = "adrienoke@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.4",
    "langchain-google-genai>=4.4.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "neatlogs[google-genai]>=1.4.26",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]<0.3",
    "pytest>=9.1.1",
]
