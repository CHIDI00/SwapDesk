[project]
name = "swapdesk"
version = "0.1.0"
description = "SwapDesk exchange agent for a fictional shoe shop (neatHack)"
authors = [
    { name = "adr1en360", email = "adrienoke@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "langchain>=1.4.4",
    "langchain-google-genai>=4.4.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "neatlogs[google-genai]>=1.4.26",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "langgraph-cli[inmem]>=0.4",
    "pytest>=9.1.1",
]

[tool.uv]
# langgraph-api needs protobuf 6; neatlogs' autogen instrumentation caps it
# below 5.30. Nothing imports autogen at runtime here, so let 6 win.
override-dependencies = [
    "protobuf>=6.32.1,<7.0.0",
]
